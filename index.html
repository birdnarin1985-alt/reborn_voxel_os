<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Zygote GPU Mirror Graph Simulation</title>
    <style>
        body { margin: 0; background: #050505; color: #00ffcc; font-family: monospace; overflow: hidden; }
        #canvas { width: 100vw; height: 100vh; display: block; }
        #hud { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.8); padding: 15px; border: 1px solid #00ffcc; border-radius: 5px; pointer-events: none; }
        .heart { color: #ff3366; animation: beat 0.5s infinite alternate; display: inline-block; }
        @keyframes beat { to { transform: scale(1.2); } }
    </style>
</head>
<body>

    <div id="hud">
        <h2>🧬 Zygote Personal AI Engine (60 FPS)</h2>
        <p>สเตตัสหัวใจใน GPU: <span class="heart">❤️</span> <span id="bpm">Pulsing...</span></p>
        <p>จำนวนเซลล์ (Recursive Nodes): <span id="cell-count">1</span></p>
        <p>รูปแบบการรับรู้: <span id="duality">สตรีมคลื่นความน่าจะเป็น</span></p>
        <small>กดคลิกที่หน้าจอ = ฉีดอสุจิ (DNA Injector)</small>
    </div>

    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        // 1. Columnar Memory Buffer (เปรียบเสมือนพื้นที่ใน VRAM/RAM ของ GPU)
        // จัดเก็บข้อมูลแยกเป็นคอลัมน์เพื่อประมวลผลเป็นอาเรย์แบนตามที่คุณต้องการ
        const GPU_VRAM = {
            posX: [], posY: [],
            size: [], parentIdx: [],
            pulsePhase: [], isAlive: []
        };

        // 2. DNA Injector & Recursive Cell Division (กลไกอสุจิผสมไข่เป็นไซโกต)
        // ฟังก์ชัน Recursive เพื่อจำลองการสะท้อนพอยเตอร์ (Mirror Graph) และแบ่งตัวขยายระบบ
        function injectDNA(x, y, size, parentIndex, depth) {
            if (depth > 6) return; // จำกัดความลึกเพื่อไม่ให้ฮาร์ดแวร์ราคาถูกหน่วยความจำเต็ม (ตัดอวิชชาขยะ)

            const currentIndex = GPU_VRAM.posX.length;
            
            // ฉีดรหัสเข้าคอลัมน์ฐานข้อมูลโดยตรง
            GPU_VRAM.posX.push(x);
            GPU_VRAM.posY.push(y);
            GPU_VRAM.size.push(size);
            GPU_VRAM.parentIdx.push(parentIndex);
            GPU_VRAM.pulsePhase.push(Math.random() * Math.PI * 2); // หัวใจของแต่ละเซลล์
            GPU_VRAM.isAlive.push(1); // Bitmask ประจำเซลล์ (1=อยู่, 0=สลาย)

            // เกิดปฏิกิริยาแบ่งตัวแบบทวีคูณแตกกิ่งก้าน (Recursive Mirroring)
            const angleOffset = Math.PI / 3;
            const childSize = size * 0.75;
            const distance = size * 1.5;

            // หน่อซ้าย
            injectDNA(
                x + Math.sin(depth + angleOffset) * distance, 
                y + Math.cos(depth + angleOffset) * distance, 
                childSize, currentIndex, depth + 1
            );
            // หน่อขวา (สะท้อนคู่ขนานเป็น Mirror Graph)
            injectDNA(
                x - Math.sin(depth - angleOffset) * distance, 
                y - Math.cos(depth - angleOffset) * distance, 
                childSize, currentIndex, depth + 1
            );
        }

        // เริ่มต้นจุดปฏิสนธิแรกตรงใจกลางจอ (ไซโกตแรกเริ่ม)
        injectDNA(canvas.width / 2, canvas.height / 2, 40, -1, 0);

        // 3. Event-Driven & 60 FPS GPU Heartbeat Simulation Loop
        let time = 0;
        function renderLoop() {
            time += 0.05;
            ctx.fillStyle = 'rgba(5, 5, 5, 0.2)'; // เทคนิค Fade ทิ้ง เพื่อเรนเดอร์เฉพาะแสงสะท้อนปัจจุบัน
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const totalNodes = GPU_VRAM.posX.length;
            document.getElementById('cell-count').innerText = totalNodes;
            document.getElementById('bpm').innerText = `${Math.round(60 + Math.sin(time)*10)} BPM (ลื่นปื๊ด)`;

            // จำลองการกวาดข้อมูลขนานใน GPU Threads ด้วย Loop เส้นตรงเดี่ยว (Vectorized Scan)
            for (let i = 0; i < totalNodes; i++) {
                if (GPU_VRAM.isAlive[i] === 0) continue; // ข้ามตัวกรองที่เป็นอวิชชาหรือเดดโน้ตทันที

                // อัพเดต "หัวใจ" ในคอลัมน์โดยตรง (GPU Pulse Engine ขยับตามคลื่น Sin)
                GPU_VRAM.pulsePhase[i] += 0.1;
                const heartBeatScale = 1.0 + Math.sin(GPU_VRAM.pulsePhase[i]) * 0.15;
                const currentSize = GPU_VRAM.size[i] * heartBeatScale;

                // วาดความเชื่อมโยงของสายใยพอยเตอร์ (Graph Pointers Lines)
                const pIdx = GPU_VRAM.parentIdx[i];
                if (pIdx !== -1) {
                    ctx.beginPath();
                    ctx.moveTo(GPU_VRAM.posX[i], GPU_VRAM.posY[i]);
                    ctx.lineTo(GPU_VRAM.posX[pIdx], GPU_VRAM.posY[pIdx]);
                    ctx.strokeStyle = 'rgba(0, 255, 204, 0.2)';
                    ctx.lineWidth = 1;
                    ctx.stroke();
                }

                // เรนเดอร์ตัวเซลล์ (ทรงกลมชีวิตินทรีย์)
                ctx.beginPath();
                ctx.arc(GPU_VRAM.posX[i], GPU_VRAM.posY[i], currentSize, 0, Math.PI * 2);
                ctx.fillStyle = `hsla(${160 + (i % 40)}, 100%, 50%, 0.6)`;
                ctx.shadowBlur = currentSize * 0.5;
                ctx.shadowColor = '#00ffcc';
                ctx.fill();
            }

            requestAnimationFrame(renderLoop); // บังคับรันให้คงที่ลื่นไหลที่ระดับ 60 FPS เบาสวิลวิววิว
        }

        // Event-Driven: คลิกเพื่อเพิ่มจุดสเปิร์ม/ฉีด DNA ใหม่ลงระบบสตรีม
        window.addEventListener('click', (e) => {
            document.getElementById('duality').innerText = "ยุบตัวเป็นอนุภาคเฉพาะจุดผัสสะ!";
            injectDNA(e.clientX, e.clientY, 25, -1, 2);
            setTimeout(() => {
                document.getElementById('duality').innerText = "สตรีมคลื่นความน่าจะเป็น";
            }, 1000);
        });

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        // เปิดสวิตช์ระบบให้ทำงาน
        renderLoop();
    </script>
</body>
</html>
