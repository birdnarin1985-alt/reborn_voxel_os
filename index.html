<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Chicken DNA GPU Columnar Simulator</title>
    <style>
        body { margin: 0; background: #07070a; color: #00ffcc; font-family: monospace; overflow: hidden; }
        #canvas { width: 100vw; height: 100vh; display: block; }
        #hud { position: absolute; top: 10px; left: 10px; background: rgba(5,5,10,0.85); padding: 20px; border: 1px solid #00ffcc; border-radius: 6px; pointer-events: none; box-shadow: 0 0 15px rgba(0,255,204,0.2); }
        .heart { color: #ff3366; animation: beat 0.4s infinite alternate; display: inline-block; }
        @keyframes beat { to { transform: scale(1.25); } }
        .btn-hint { color: #ffcc00; font-weight: bold; }
    </style>
</head>
<body>

    <div id="hud">
        <h2>🧬 Chicken DNA Architectural AI (60 FPS)</h2>
        <p>สภาวะหัวใจรูปชีวิต: <span class="heart">❤️</span> <span id="status-text">กำลังฟักตัว...</span></p>
        <p>โครงสร้างองค์ประกอบ (Columnar Nodes): <span id="node-count">0</span> เซลล์</p>
        <p>ระบบเสียงใน DNA: <span style="color:#ffcc00;">Columnar Synth (เบาสวิ้ว)</span></p>
        <p class="btn-hint">👉 คลิกที่หน้าจอ = สั่งส่งสัญญาณ Event ให้ "ไก่ร้องกะต๊าก" และแบ่งเซลล์เพิ่ม</p>
    </div>

    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        // ระบบเสียง Web Audio API จำลองการดึงค่าจาก Columnar Audio Database
        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        // ฟังก์ชันสังเคราะห์เสียงไก่จาก "รหัสความถี่คณิตศาสตร์" ไม่พึ่งพาไฟล์ Row แบบล้าหลัง
        function playChickenSound(baseFreq) {
            initAudio();
            if (!audioCtx) return;

            const now = audioCtx.currentTime;
            
            // 1. เสียงกะต๊ากหลัก (Master Oscillator)
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            osc.type = 'sawtooth'; // ใช้คลื่นฟันปลาจำลองความแหบของเสียงไก่
            osc.frequency.setValueAtTime(baseFreq, now);
            // โยนิโสมนสิการไล่ระดับความถี่ (Pitch Modulation) ตกฮวบลงแปรผันตามเวลาแบบธรรมชาติ
            osc.frequency.exponentialRampToValueAtTime(baseFreq * 0.4, now + 0.3);

            // 2. การควบคุมความดัง (Volume Envelope) เกิดและดับอย่างรวดเร็ว
            gainNode.gain.setValueAtTime(0.3, now);
            gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.3);

            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            osc.start(now);
            osc.stop(now + 0.3);
        }

        // -------------------------------------------------------------
        // ฐานข้อมูลแบบ COLUMNAR DICTIONARY MAPPING อัดข้อมูลแนวตั้งแบนราบ
        // -------------------------------------------------------------
        const CHICKEN_GPU_VRAM = {
            id: [],
            posX: [], posY: [],
            baseSize: [],
            colorHue: [],
            pulsePhase: [],
            parentIdx: [],
            audioFreq: [] // คอลัมน์เก็บพิมพ์เขียวความถี่เสียงประจำโหนด
        };

        // ฟังก์ชันแบ่งรหัสพันธุกรรมแบบ Recursive (Zygote Mirror Graph Generation)
        function injectChickenDNA(x, y, size, parentIndex, depth) {
            if (depth > 5) return; // ควบคุมไม่ให้โครงสร้างบวมเพื่อประหยัด VRAM

            const currentIndex = CHICKEN_GPU_VRAM.posX.length;
            
            // ปฏิสนธิข้อมูลลงในอาเรย์เส้นตรง (Vectorized Setup)
            CHICKEN_GPU_VRAM.id.push(currentIndex);
            CHICKEN_GPU_VRAM.posX.push(x);
            CHICKEN_GPU_VRAM.posY.push(y);
            CHICKEN_GPU_VRAM.baseSize.push(size);
            CHICKEN_GPU_VRAM.pulsePhase.push(Math.random() * Math.PI * 2);
            CHICKEN_GPU_VRAM.parentIdx.push(parentIndex);
            
            // กำหนดสีตามโครงสร้างเนื้อเยื่อไก่ (แดง/หงอน, ส้ม/ขน, เหลือง/ปากและขา)
            if (depth === 0) {
                CHICKEN_GPU_VRAM.colorHue.push(0);      // สีแดง (หงอนไก่/หัวใจหลัก)
                CHICKEN_GPU_VRAM.audioFreq.push(380);   // ความถี่เสียงหลักของพ่อพันธุ์
            } else if (depth < 3) {
                CHICKEN_GPU_VRAM.colorHue.push(25);     // สีส้ม/น้ำตาล (โครงสร้างตัวและปีก)
                CHICKEN_GPU_VRAM.audioFreq.push(420);
            } else {
                CHICKEN_GPU_VRAM.colorHue.push(45);     // สีเหลืองทอง (ส่วนปลาย/ขา/ปาก)
                CHICKEN_GPU_VRAM.audioFreq.push(500);
            }

            // แบ่งตัวออกแบบแตกกิ่งกระจกเงาคู่ขนานขยายรูปทรงไก่
            const spread = size * 1.6;
            injectChickenDNA(x - spread * 0.6, y + spread * 0.8, size * 0.75, currentIndex, depth + 1);
            injectChickenDNA(x + spread * 0.6, y + spread * 0.8, size * 0.75, currentIndex, depth + 1);
        }

        // ฉีดจุดเริ่มต้นของรหัสไก่ตัวแรกกลางหน้าจอ
        injectChickenDNA(canvas.width / 2, canvas.height / 3, 35, -1, 0);

        // -------------------------------------------------------------
        // EVENT-DRIVEN & GPU COMPUTE SIMULATION LOOP (60 FPS)
        // -------------------------------------------------------------
        let globalTime = 0;

        function processAndRender() {
            globalTime += 0.04;
            
            // เทคนิคการเกลี่ยสีพื้นหลังบางๆ เพื่อคงเหลือเฉพาะรอยแสงสะท้อนปัจจุบัน (Frustum/Light Culling Effect)
            ctx.fillStyle = 'rgba(7, 7, 10, 0.25)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const totalNodes = CHICKEN_GPU_VRAM.id.length;
            document.getElementById('node-count').innerText = totalNodes;

            // รันจังหวะหัวใจและการเรนเดอร์ในลูปเดียวขนานตรง (Simulated GPU Core Threads)
            for (let i = 0; i < totalNodes; i++) {
                
                // อัปเดตพัลส์หัวใจในระดับคอลัมน์ความถี่รูปชีวิต
                CHICKEN_GPU_VRAM.pulsePhase[i] += 0.08;
                const dynamicPulse = 1.0 + Math.sin(CHICKEN_GPU_VRAM.pulsePhase[i]) * 0.12;
                const renderSize = CHICKEN_GPU_VRAM.baseSize[i] * dynamicPulse;

                // วาดเส้นโยงพอยเตอร์แสดงสายใยเหตุปัจจัยปฏิจจสมุปบาทของโครงสร้างกราฟ
                const pIdx = CHICKEN_GPU_VRAM.parentIdx[i];
                if (pIdx !== -1) {
                    ctx.beginPath();
                    ctx.moveTo(CHICKEN_GPU_VRAM.posX[i], CHICKEN_GPU_VRAM.posY[i]);
                    ctx.lineTo(CHICKEN_GPU_VRAM.posX[pIdx], CHICKEN_GPU_VRAM.posY[pIdx]);
                    ctx.strokeStyle = `hsla(${CHICKEN_GPU_VRAM.colorHue[i]}, 90%, 50%, 0.15)`;
                    ctx.lineWidth = 2;
                    ctx.stroke();
                }

                // เรนเดอร์ตัวอนุภาคเซลล์เนื้อเยื่อไก่ ส่องสว่างเฉพาะจุดที่มีผัสสะ
                ctx.beginPath();
                ctx.arc(CHICKEN_GPU_VRAM.posX[i], CHICKEN_GPU_VRAM.posY[i], renderSize, 0, Math.PI * 2);
                ctx.fillStyle = `hsla(${CHICKEN_GPU_VRAM.colorHue[i]}, 95%, 55%, 0.75)`;
                ctx.shadowBlur = renderSize * 0.8;
                ctx.shadowColor = `hsla(${CHICKEN_GPU_VRAM.colorHue[i]}, 95%, 55%, 0.5)`;
                ctx.fill();
            }

            requestAnimationFrame(processAndRender); // รักษาความนิ่งที่ระดับความเร็วสูง 60 FPS ลื่นปื๊ด
        }

        // ดักจับเหตุการณ์ (Event-Driven): เมื่อมีการสัมผัสหน้าจอ เกิดผัสสะอายตนะ
        window.addEventListener('click', (e) => {
            document.getElementById('status-text').innerText = "กะต๊าก! (สตรีมมิ่งคลื่นเสียงผ่านคอลัมน์)";
            
            // ดึงค่าความถี่เสียงจาก Node รากฐานในฐานข้อมูลคอลัมน์มายิงเสียงทันที
            const rootFreq = CHICKEN_GPU_VRAM.audioFreq[0] || 380;
            playChickenSound(rootFreq + (Math.random() * 60 - 30));

            // ฉีดตัวอ่อนจุดย่อยใหม่ในพิกัดที่คลิกเพื่อขยายเซลล์ไก่สะท้อนเงาคู่ขนาน
            injectChickenDNA(e.clientX, e.clientY, 15, -1, 2);

            setTimeout(() => {
                document.getElementById('status-text').innerText = "กำลังเต้นเสถียร 60 FPS";
            }, 800);
        });

        // รองรับการยืดขยายหน้าจอสมาร์ทโฟน
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        // เปิดสวิตช์ระบบสตรีมมิ่งชีวิตินทรีย์ไก่
        processAndRender();
    </script>
</body>
</html>
